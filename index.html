<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wildflower Garden</title>
<style>
  html, body { margin: 0; height: 100%; background: #1c1f3a; overflow: hidden; }
  /* fixed + inset 0 = exactly the visible area; 100vh on phones runs under the browser toolbar */
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: pointer; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// Usage: garden.html?name=Sarah  or  garden.html?msg=happy%20birthday&name=Sarah
const params = new URLSearchParams(location.search);
const name = params.get('name');
const MESSAGE = (params.get('msg') || 'flowers from me ♡') + (name ? ', ' + name : '');

const SKY_TOP = '#141733', SKY_LOW = '#3a2448', GLOW = '#7a3a5e', GROUND = '#120f1f';
const C = { pink: '#ff8fb8', red: '#ff3b5c', deep: '#b3122e', yellow: '#ffd23f', blue: '#6a7cff', purple: '#a07cff', white: '#fff1f5', rose: '#ff5fa2', blush: '#ffc2d6', orange: '#ff9f1c' };
const STEM_DARK = ['#2e9e44', '#3aa84e', '#279a40'];   // near the ground
const STEM_LIGHT = ['#6fe07c', '#82e88a', '#5fd86e'];  // near the bloom
const LEAF = ['#4caf50', '#66bb6a', '#7cc576'];
const GRASS = ['#2f7d3d', '#3a8f47', '#2a6e37', '#46a052'];
const STAR_CHARS = ['+', '·', '.', '*'];
const STAR_COLORS = ['#ffffff', '#fff2c4', '#ffd6e8', '#ffe3ef'];
const FLY_COLORS = ['#ffd6e8', '#ff8fb8', '#ffe98a', '#ffb3d1', '#ff6f9f'];

// Camera: circles the heart-shaped garden once every 40 s, above it, looking down at it.
const ORBIT = (Math.PI * 2) / 40000;
const FIELD_R = 4;     // garden size (world units; a tall flower is ~0.7)
const CAM_D = 5.6;     // camera distance from the garden centre
const CAM_H = 4.2;     // camera height (high enough to see the heart shape)
const PITCH = 0.62;    // how far the camera looks down (radians)

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
canvas.setAttribute('aria-label', `A heart-shaped garden of wildflowers bordered with red roses, drawn with text characters under a moonlit starry sky, slowly circling, with glowing heart fireflies and the message "${MESSAGE}". Tap for a new garden.`);
const STILL = matchMedia('(prefers-reduced-motion: reduce)').matches;
const rand = (a, b) => a + Math.random() * (b - a);
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const mix = (a, b, u) => a.map((v, i) => v + (b[i] - v) * u);
const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
const rgb = c => `rgb(${c.map(Math.round).join(',')})`;

let W, H, cols, rows, cw, chh, size, boldFont, thinFont, F, cx, cy, horizonY;
let pts, heads, stars, dust, flies, shooting, nextShoot = 0, bornAt, startAt, plantPhase = 0;

function resize() {
  const box = canvas.getBoundingClientRect();
  W = box.width; H = box.height;
  const dpr = window.devicePixelRatio || 1;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  size = Math.max(8, Math.floor(Math.min(W / 110, H / 64)));
  boldFont = `bold ${size}px "Courier New", monospace`;
  thinFont = `${size}px "Courier New", monospace`;
  ctx.font = boldFont;
  cw = ctx.measureText('M').width;
  chh = size * 1.05;
  cols = Math.floor(W / cw);
  rows = Math.floor(H / chh);
  F = Math.min(W * 0.7, H * 0.55); // focal length in px: whole heart fits the width, sky keeps ~1/4 of the screen
  cx = W / 2;
  cy = H * 0.62;
  horizonY = cy - Math.tan(PITCH) * F;
  makeSky();
  generate();
}

// ---------- 3D -> screen ----------
let ca = 1, sa = 0;
const cp = Math.cos(PITCH), sp = Math.sin(PITCH);
let PX, PY, PD; // results of project(), kept in globals to avoid garbage every frame
function project(x, y, z) {
  const xr = x * ca - z * sa, zr = x * sa + z * ca;   // turn the world = camera circling
  const yc = y - CAM_H, zc = CAM_D - zr;
  const ycam = yc * cp + zc * sp, d = zc * cp - yc * sp; // tilt down
  if (d < 0.4) return false;
  PX = cx + (xr / d) * F; PY = cy - (ycam / d) * F; PD = d;
  return true;
}

// ---------- heart shape on the ground ----------
// Classic heart curve, scaled so it is about FIELD_R across. Returns ground [x, z].
const HS = FIELD_R / 17;
const heartEdge = t => [16 * Math.sin(t) ** 3 * HS, -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t)) * HS + 0.4];
// Random point inside the heart: (x²+y²-1)³ - x²y³ <= 0 in unit coordinates.
function insideHeart() {
  for (;;) {
    const X = rand(-1.15, 1.15), Y = rand(-1.0, 1.25);
    if ((X * X + Y * Y - 1) ** 3 - X * X * Y ** 3 <= 0) return [X * FIELD_R * 0.9, -Y * FIELD_R * 0.9 + 0.4];
  }
}

// ---------- flowers ----------
// Pixel-art flowers. X = petal, O = centre, . = empty. Each pixel is drawn 2 characters wide,
// because a character cell is about twice as tall as it is wide.
const ART = {
  small: ['.X.', 'XOX', '.X.'],
  mid:   ['.X.X.', 'XXOXX', '.X.X.'],
  round: ['.XXX.', 'XXOXX', '.XXX.'],
  big:   ['..X.X..', '.XXXXX.', 'XXXOXXX', '.XXXXX.', '..X.X..'],
  star:  ['X.X.X', '.XXX.', 'XXOXX', '.XXX.', 'X.X.X'],
  cup:   ['X.X.X', 'XXXXX', '.XXX.'],
  rose:  ['.XXX.', 'XOXOX', 'XXOXX', '.XXX.'],                 // rose with a curled centre
};
function art(name, petal, centre) {
  const g = ART[name], h = g.length, w = g[0].length, cells = [];
  const top = name === 'cup' ? -(h - 1) : -Math.floor(h / 2); // cup sits on the stem tip, others centre on it
  g.forEach((row, y) => [...row].forEach((v, x) => {
    if (v === '.') return;
    const [ch, color] = v === 'O' && centre ? centre : petal;
    for (let k = 0; k < 2; k++) cells.push([(x - (w - 1) / 2) * 2 + k - 1, top + y, ch, color]);
  }));
  return cells;
}
const spike = len => { const out = []; for (let dy = 0; dy < len; dy++) { out.push([0, -dy, '8', C.purple]); if (dy % 2) out.push([1, -dy, '8', C.purple]); } return out; };

// Each kind has three sizes: near (big), middle (small) and far away (a single dot),
// picked every frame from the distance, so far flowers really look far.
const ROSE = () => { const p = ['@', C.red], c = ['@', C.deep]; return [art('rose', p, c), art('small', p, c), [[0, 0, '@', C.red]]]; };
const KINDS = [
  ROSE, ROSE,                                                                                                                                  // roses (twice as common)
  () => { const p = ['o', C.white], c = ['@', C.yellow]; return [art(pick(['big', 'round']), p, c), art('small', p, c), [[0, 0, 'o', C.white]]]; },       // daisy
  () => { const col = pick([C.pink, C.rose, C.blush]), p = ['o', col], c = ['*', C.yellow]; return [art(pick(['big', 'round']), p, c), art('small', p, c), [[0, 0, 'o', col]]]; }, // cosmos
  () => { const col = pick([C.pink, C.rose, C.red]), p = ['@', col]; return [art('cup', p), art('small', p, p), [[0, 0, '@', col]]]; },  // tulip
  () => { const col = pick([C.blush, C.pink, C.white]), p = ['o', col], c = ['.', C.orange]; return [art('mid', p, c), art('small', p, c), [[0, 0, 'o', col]]]; }, // little bloom
  () => { const p = ['*', C.blue], c = ['o', C.white]; return [art('star', p, c), art('small', p, c), [[0, 0, '*', C.blue]]]; },             // cornflower
  () => [spike(6), spike(3), [[0, 0, '8', C.purple]]],                                                                                       // lavender
];

// One 3D point. ch = null means "stem": its glyph is picked each frame from the projected slope.
// w = how much the wind moves it (tips most), ph = its plant's wind phase.
function P(x, y, z, ch, color, t, tan, first) {
  pts.push({ x, y, z, ch, color, t, tan, first, ph: plantPhase, w: Math.max(0, y) ** 1.4 });
}

function stemChar(dx, dy) {
  const a = Math.atan2(dx, -dy); // 0 = straight up on screen
  if (Math.abs(a) < 0.3 || Math.abs(a) > Math.PI - 0.3) return '|';
  if (Math.abs(a) > 1.25 && Math.abs(a) < Math.PI - 1.25) return '-';
  return (a > 0) === (Math.abs(a) < Math.PI / 2) ? '/' : '\\';
}

// One flower: curved stem from the ground at (x0, z0), head of the given kind on top.
function plant(x0, z0, kind, hMin, hMax) {
  plantPhase = x0 * 0.8 + z0 * 0.5 + rand(-0.4, 0.4); // neighbours sway together, like a breeze passing
  const h = rand(hMin, hMax);
  const la = rand(0, Math.PI * 2), lean = rand(0.02, 0.12) * h;
  const lx = Math.cos(la) * lean, lz = Math.sin(la) * lean;
  const P0 = [x0, 0, z0], P1 = [x0, h * 0.4, z0], P2 = [x0 + lx * 0.5, h * 0.8, z0 + lz * 0.5], P3 = [x0 + lx, h - lean * 0.3, z0 + lz];
  const dark = hex(pick(STEM_DARK)), light = hex(pick(STEM_LIGHT));
  const grow = rand(0.3, 0.75);
  const n = Math.ceil(h * (F / (CAM_D - FIELD_R)) / chh * 1.5) + 3;
  let p = P0;
  for (let i = 1; i <= n; i++) {
    const u = i / n, v = 1 - u;
    const b0 = v * v * v, b1 = 3 * v * v * u, b2 = 3 * v * u * u, b3 = u * u * u;
    p = [0, 1, 2].map(k => b0 * P0[k] + b1 * P1[k] + b2 * P2[k] + b3 * P3[k]);
    const tan = [0, 1, 2].map(k => 3 * v * v * (P1[k] - P0[k]) + 6 * v * u * (P2[k] - P1[k]) + 3 * u * u * (P3[k] - P2[k]));
    P(p[0], p[1], p[2], null, rgb(mix(dark, light, u)), u * grow, tan, i === 1);
    if (Math.random() < 0.06 && u > 0.2 && u < 0.7) {
      const sd = Math.random() < 0.5 ? 1 : -1;
      P(p[0] + sd * 0.03, p[1] + 0.01, p[2], sd > 0 ? ')' : '(', pick(LEAF), u * grow); // little leaf
    }
  }
  heads.push({ c: p, lods: kind(), t: grow + rand(0, 0.1), ph: plantPhase, w: Math.max(0, p[1]) ** 1.4 });
}

function generate() {
  pts = [];
  heads = [];
  const small = Math.min(W, H) < 600;

  // border of red roses tracing the heart
  const border = small ? 56 : 70;
  for (let i = 0; i < border; i++) {
    const [x, z] = heartEdge((i / border) * Math.PI * 2);
    plant(x + rand(-0.05, 0.05), z + rand(-0.05, 0.05), ROSE, 0.3, 0.45);
  }
  // inside: wildflower patches (1-3 of the same kind growing together)
  const clumps = Math.round(small ? rand(50, 60) : rand(65, 80));
  for (let c = 0; c < clumps; c++) {
    const [bx, bz] = insideHeart();
    const kind = pick(KINDS);
    const count = 1 + Math.floor(Math.random() * 3);
    for (let s = 0; s < count; s++) plant(bx + rand(-0.12, 0.12), bz + rand(-0.12, 0.12), Math.random() < 0.8 ? kind : pick(KINDS), 0.35, 0.75);
  }
  // grass tufts on the ground so it reads as a meadow, not floating flowers
  const grass = small ? 380 : 650;
  for (let i = 0; i < grass; i++) {
    const r = FIELD_R * 1.25 * Math.sqrt(Math.random()), a = rand(0, Math.PI * 2);
    plantPhase = rand(0, 6.28);
    P(Math.cos(a) * r, rand(0, 0.04), Math.sin(a) * r + 0.3, pick([',', '"', "'", '.', '`', ',']), pick(GRASS), 0);
  }
  bornAt = performance.now();
}

// ---------- sky ----------
function makeSky() {
  dust = Array.from({ length: Math.round(W * H / 2500) }, () => ({
    x: rand(0, W), y: rand(0, H), r: rand(0.4, 1.1), a: rand(0.15, 0.5), ph: rand(0, 6.28), sp: rand(0.3, 1.2),
  }));
  stars = Array.from({ length: Math.round(cols * rows / 200) }, () => ({
    x: Math.floor(rand(0, cols)), y: Math.floor(rand(0, rows)),
    ch: pick(STAR_CHARS), color: pick(STAR_COLORS), ph: rand(0, 6.28), sp: rand(0.5, 1.6), glow: Math.random() < 0.15,
  }));
  flies = Array.from({ length: Math.max(14, Math.round(W * H / 36000)) }, () => ({
    x: rand(0, 1), y: rand(0, 1), ph: rand(0, 6.28), ph2: rand(0, 6.28), sp: rand(0.6, 1.4),
    rise: rand(4, 10), color: pick(FLY_COLORS),
    b: Math.random() < 0.85 ? 0 : 1, px: Math.max(6, Math.round(size * rand(0.6, 0.8))),
  }));
  heartCache.clear(); // glyph size changes with the window
  moonSprite = null;
}

// Pixel moon made of characters, drawn once with a soft glow.
const MOON = ['..####..', '.######.', '########', '#######.', '######..', '#######.', '.######.', '..####..'];
let moonSprite = null;
function moon() {
  if (moonSprite) return moonSprite;
  const px = Math.max(8, Math.round(size * 0.95)), gw = px * 0.62, pad = 30, dpr = window.devicePixelRatio || 1;
  const c = document.createElement('canvas');
  c.cssW = Math.ceil(MOON[0].length * 2 * gw + pad * 2); c.cssH = Math.ceil(MOON.length * px + pad * 2);
  c.width = Math.ceil(c.cssW * dpr); c.height = Math.ceil(c.cssH * dpr);
  const g = c.getContext('2d');
  g.scale(dpr, dpr);
  g.font = `bold ${px}px "Courier New", monospace`;
  g.textBaseline = 'top';
  g.fillStyle = '#fff4e0'; g.shadowColor = '#ffd9b0'; g.shadowBlur = 18;
  MOON.forEach((row, y) => [...row].forEach((v, x) => {
    if (v === '#') for (let k = 0; k < 2; k++) g.fillText((x + y) % 5 ? 'o' : '.', pad + (x * 2 + k) * gw, pad + y * px);
  }));
  return (moonSprite = c);
}

function drawSky(now, buf) {
  const t = STILL ? 0 : now / 1000;
  // sky: deep navy fading to a warm rose glow at the horizon
  const s = ctx.createLinearGradient(0, 0, 0, horizonY);
  s.addColorStop(0, SKY_TOP); s.addColorStop(0.75, SKY_LOW); s.addColorStop(1, GLOW);
  ctx.globalAlpha = 1;
  ctx.fillStyle = s;
  ctx.fillRect(0, 0, W, horizonY);
  const g = ctx.createLinearGradient(0, horizonY, 0, H);
  g.addColorStop(0, GLOW); g.addColorStop(0.12, '#2a1a35'); g.addColorStop(1, GROUND);
  ctx.fillStyle = g;
  ctx.fillRect(0, horizonY, W, H - horizonY);

  const m = moon();
  ctx.globalAlpha = 0.95;
  ctx.drawImage(m, Math.round(W * 0.78 - m.cssW / 2), Math.round(horizonY * 0.3 - m.cssH / 2), m.cssW, m.cssH);

  for (const d of dust) {
    if (d.y > horizonY) continue;
    ctx.globalAlpha = d.a * (0.6 + 0.4 * Math.sin(t * d.sp + d.ph));
    ctx.fillStyle = '#ffe6f0';
    ctx.fillRect(d.x, d.y, d.r, d.r);
  }
  ctx.font = thinFont;
  for (const st of stars) {
    if (st.y * chh > horizonY - chh * 2 || buf.has(st.y * cols + st.x)) continue;
    const tw = Math.max(0, Math.sin(t * st.sp + st.ph));
    ctx.globalAlpha = STILL ? 0.6 : 0.15 + 0.85 * tw * tw;
    ctx.fillStyle = st.color;
    if (st.glow) { ctx.shadowColor = st.color; ctx.shadowBlur = 8 * tw; }
    ctx.fillText(st.glow ? '✦' : st.ch, st.x * cw, st.y * chh);
    ctx.shadowBlur = 0;
  }

  if (!STILL) {
    if (!shooting && now > nextShoot) {
      shooting = { t0: now, x: rand(0.1, 0.9) * W, y: rand(0.02, 0.5) * horizonY, dx: Math.random() < 0.5 ? -1 : 1 };
    }
    if (shooting) {
      const k = (now - shooting.t0) / 900;
      if (k > 1) { shooting = null; nextShoot = now + rand(5000, 11000); }
      else {
        const len = Math.min(W, H) * 0.25;
        const hx = shooting.x + shooting.dx * len * k * 1.5, hy = shooting.y + len * k * 0.6;
        const gr = ctx.createLinearGradient(hx, hy, hx - shooting.dx * len * 0.5, hy - len * 0.2);
        gr.addColorStop(0, 'rgba(255,240,245,0.9)'); gr.addColorStop(1, 'rgba(255,240,245,0)');
        ctx.globalAlpha = 1 - k;
        ctx.strokeStyle = gr; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.moveTo(hx, hy); ctx.lineTo(hx - shooting.dx * len * 0.5, hy - len * 0.2); ctx.stroke();
      }
    }
  }
}

// ---------- heart fireflies ----------
const HEART_BITMAPS = [
  ['.#.#.', '#####', '.###.', '..#..'],
  ['.##.##.', '#######', '#######', '.#####.', '..###..', '...#...'],
];
const heartCache = new Map();
// Draw each heart once to an offscreen canvas (at the screen's real pixel density, so it stays sharp), then reuse it.
function heartSprite(b, color, px) {
  const key = b + color + px;
  if (heartCache.has(key)) return heartCache.get(key);
  const rowsB = HEART_BITMAPS[b], gw = px * 0.62, gh = px, pad = 10;
  const dpr = window.devicePixelRatio || 1, c = document.createElement('canvas');
  c.cssW = Math.ceil(rowsB[0].length * gw + pad * 2);
  c.cssH = Math.ceil(rowsB.length * gh + pad * 2);
  c.width = Math.ceil(c.cssW * dpr);
  c.height = Math.ceil(c.cssH * dpr);
  const g = c.getContext('2d');
  g.scale(dpr, dpr);
  g.font = `bold ${px}px "Courier New", monospace`;
  g.textBaseline = 'top';
  g.fillStyle = color;
  g.shadowColor = color;
  g.shadowBlur = 2;
  rowsB.forEach((row, y) => [...row].forEach((v, x) => {
    if (v === '#') g.fillText(x + y < 2 ? '+' : '#', pad + x * gw, pad + y * gh); // '+' = little highlight
  }));
  heartCache.set(key, c);
  return c;
}

function drawFlies(now) {
  const t = STILL ? 0 : now / 1000;
  for (const f of flies) {
    const span = H + 40;
    const x = f.x * W + Math.sin(t * 0.35 * f.sp + f.ph) * 45 + Math.sin(t * 0.9 + f.ph2) * 12;
    const y = (((f.y * span - t * f.rise) % span) + span) % span - 20 + Math.cos(t * 0.5 * f.sp + f.ph) * 18;
    const pulse = STILL ? 0.7 : Math.max(0, Math.sin(t * 1.3 * f.sp + f.ph)) ** 2;
    ctx.globalAlpha = 0.3 + 0.7 * pulse;
    const spr = heartSprite(f.b, f.color, f.px);
    ctx.drawImage(spr, Math.round(x - spr.cssW / 2), Math.round(y - spr.cssH / 2), spr.cssW, spr.cssH);
  }
}

// The message types itself out after the garden has grown, then glows softly.
function drawMessage(now) {
  const chars = [...MESSAGE];
  const shown = STILL ? chars.length : Math.max(0, Math.min(chars.length, Math.floor((now - startAt - 1800) / 110)));
  if (!shown) return;
  ctx.font = `bold ${Math.round(size * 1.35)}px "Courier New", monospace`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';
  ctx.globalAlpha = 1;
  ctx.fillStyle = C.blush;
  ctx.shadowColor = C.rose;
  ctx.shadowBlur = 10 + (STILL ? 0 : 4 * Math.sin(now / 900));
  const full = ctx.measureText(MESSAGE).width, part = chars.slice(0, shown).join('');
  // left edge stays put while typing: centre the full line, draw the typed part from its start
  ctx.textAlign = 'left';
  const x = Math.max(16, W / 2 - full / 2);
  ctx.fillText(part, x, H - chh * 3.2, W - 32);
  ctx.shadowBlur = 0;
}

// ---------- frame ----------
function draw(now) {
  const grown = STILL ? 1 : Math.min(1, (now - bornAt) / 1500); // garden grows in over 1.5 s
  const ang = STILL ? 0.6 : now * ORBIT;
  ca = Math.cos(ang); sa = Math.sin(ang);
  const wind = STILL ? 0 : now / 1300;
  const fog = d => Math.min(1, Math.max(0.3, 1.4 - d / 10)); // far away = fainter

  // Stems, leaves, grass: project each point, keep the nearest one per character cell (z-buffer).
  const buf = new Map();
  let lastX = 0, lastY = 0, haveLast = false; // previous point of the current stem, for its slope
  for (const p of pts) {
    if (p.first) haveLast = false;
    if (p.t > grown) continue;
    const sway = Math.sin(wind + p.ph) * 0.06 * p.w;
    if (!project(p.x + sway, p.y, p.z + sway * 0.5)) { haveLast = false; continue; }
    const prevX = lastX, prevY = lastY, hadPrev = haveLast;
    if (p.tan) { lastX = PX; lastY = PY; haveLast = true; }
    const fx = PX / cw, gx = Math.round(fx), gy = Math.round(PY / chh);
    if (gx < 0 || gy < 0 || gx >= cols || gy >= rows - 4) continue;
    const key = gy * cols + gx, old = buf.get(key);
    if (old && old.D <= PD) continue;
    let ch = p.ch;
    const D = PD;
    if (!ch) ch = hadPrev ? stemChar((PX - prevX) / cw, (PY - prevY) / chh) : '|'; // stem glyph from its slope on screen
    buf.set(key, { fx, gy, D, ch, color: p.color, stem: !p.ch });
  }

  // Flowers: whole shapes, far ones first so nearer flowers cover them. Size picked by distance.
  const hs = [];
  for (const h of heads) {
    if (h.t > grown) continue;
    const sway = Math.sin(wind + h.ph) * 0.06 * h.w;
    if (!project(h.c[0] + sway, h.c[1], h.c[2] + sway * 0.5)) continue;
    const rowsR = (0.13 * F) / PD / chh; // a flower's on-screen size in character rows at this distance
    const lod = rowsR > 1.4 ? 0 : rowsR > 0.55 ? 1 : 2;
    hs.push({ fx: PX / cw, gy: Math.round(PY / chh), D: PD, cells: h.lods[lod] });
  }
  hs.sort((a, b) => b.D - a.D);
  for (const { fx, gy, D, cells } of hs) {
    const gx = Math.round(fx);
    for (const [dx, dy, ch, color] of cells) {
      const x = gx + dx, y = gy + dy;
      if (x < 0 || y < 0 || x >= cols || y >= rows - 4) continue;
      const key = y * cols + x, old = buf.get(key);
      if (old && !old.head && old.D < D - 0.25) continue; // a stem clearly in front still hides it
      buf.set(key, { fx: fx + dx, gy: y, D, ch, color, head: true });
    }
  }

  ctx.textBaseline = 'top';
  drawSky(now, buf);

  // stems/grass thin, blooms bold on top
  for (const pass of [0, 1]) {
    ctx.font = pass ? boldFont : thinFont;
    for (const e of buf.values()) {
      if (!!e.head !== !!pass) continue;
      ctx.globalAlpha = fog(e.D) * (e.stem ? 0.9 : 1);
      ctx.fillStyle = e.color;
      ctx.fillText(e.ch, e.fx * cw, e.gy * chh);
    }
  }

  drawFlies(now);
  drawMessage(now);
  ctx.textAlign = 'left';
  requestAnimationFrame(draw);
}

addEventListener('resize', resize);
addEventListener('keydown', e => { if (!e.repeat) generate(); });
canvas.addEventListener('pointerdown', generate);
startAt = performance.now();
resize();
requestAnimationFrame(draw);
</script>
</body>
</html>
